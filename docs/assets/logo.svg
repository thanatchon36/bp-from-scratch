<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">bp-from-scratch</title>
  <rect width="128" height="128" rx="28" fill="#12233f"/>
  <!-- cost landscape: one narrow valley, then a flat barren plateau -->
  <path d="M14 46 C22 46 24 92 32 92 C40 92 42 64 52 64 L114 64" fill="none" stroke="#7fb0ec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the plateau: gradients vanish here -->
  <path d="M52 76 H114" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- a parameter vector stranded on the plateau -->
  <circle cx="84" cy="54" r="9" fill="#ffd166"/>
  <!-- vanishing gradient arrow -->
  <path d="M70 34 H98" stroke="#ffd166" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M78 26 H90" stroke="#ffd166" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="84" cy="18" r="2.4" fill="#ffd166"/>
</svg>
